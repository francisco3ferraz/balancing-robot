<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt telemetry</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  #bar { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  #status { font-family: ui-monospace, monospace; font-size: 0.9rem; }
  #pause { font: inherit; padding: 2px 12px; }
  #status.down { color: #c0392b; }
</style>
</head>
<body>
<h1>Tilt angle</h1>
<div id="bar">
  <button id="pause">Pause</button>
  <span id="status">connecting…</span>
</div>
<div id="chart"></div>

<script>
const windowSeconds = 10;

const time = [], accel = [], gyro = [], filtered = [];
let boardTime = 0;     // seconds, summed from dt_us so it follows the board's clock
let received = 0;
let latest = null;
let dirty = false;
let paused = false;

const chart = new uPlot({
  width: window.innerWidth - 32,
  height: 420,
  scales: {
    x: { time: false },
    y: { range: [-90, 90] }, // fixed, so drift and spikes leave the plot instead of rescaling it
  },
  axes: [{ label: "seconds" }, { label: "degrees" }],
  series: [
    {},
    { label: "accel_angle", stroke: "#e67e22" },
    { label: "gyro_angle (aligned at left edge)", stroke: "#3498db" },
    { label: "angle (filtered)", stroke: "#222", width: 2 },
  ],
}, [[], [], [], []], document.getElementById("chart"));

window.addEventListener("resize", () => {
  chart.setSize({ width: window.innerWidth - 32, height: 420 });
});

const status = document.getElementById("status");
const events = new EventSource("/events");

events.onopen = () => status.classList.remove("down");
events.onerror = () => {
  status.textContent = "disconnected, retrying…";
  status.classList.add("down");
};

events.onmessage = (msg) => {
  const s = JSON.parse(msg.data);
  boardTime += s.dt_us / 1e6;
  time.push(boardTime);
  accel.push(s.accel_angle);
  gyro.push(s.gyro_angle);
  filtered.push(s.angle);

  while (time[0] < boardTime - windowSeconds) {
    time.shift(); accel.shift(); gyro.shift(); filtered.shift();
  }

  received++;
  latest = s;
  dirty = true;
};

// Samples arrive at 100 Hz; redraw at most once per screen refresh.
function draw() {
  if (dirty && !paused) {
    // gyro_angle drifts without limit. Start it on the filtered angle at the
    // left edge, so the line shows only the drift within the visible window.
    const offset = filtered[0] - gyro[0];
    // Copies, because onmessage keeps changing the arrays; a paused chart
    // must not change underneath the cursor.
    chart.setData([time.slice(), accel.slice(), gyro.map(g => g + offset), filtered.slice()]);
    dirty = false;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// While paused, data keeps arriving (and the log keeps recording); only the
// chart stops updating, so hover and drag-to-zoom work. Double-click unzooms.
const pauseButton = document.getElementById("pause");
function togglePause() {
  paused = !paused;
  pauseButton.textContent = paused ? "Resume" : "Pause";
}
pauseButton.addEventListener("click", () => {
  togglePause();
  pauseButton.blur(); // otherwise the space bar would also "click" the focused button
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    togglePause();
  }
});

setInterval(() => {
  if (latest && !status.classList.contains("down")) {
    status.textContent =
      `${received} samples/s   angle ${latest.angle.toFixed(2)}°   ` +
      `rate ${latest.gyro_rate.toFixed(1)}°/s   dt ${latest.dt_us} µs`;
  }
  received = 0;
}, 1000);
</script>
</body>
</html>
